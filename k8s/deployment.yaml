apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app-__VERSION__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app-__VERSION__
  template:
    metadata:
      labels:
        app: student-app-__VERSION__
    spec:
      containers:
        - name: student-app
          image: nandakrishnanm/student-app:__VERSION__
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: student-app-__VERSION__-svc
spec:
  type: NodePort
  selector:
    app: student-app-__VERSION__
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: __PORT__