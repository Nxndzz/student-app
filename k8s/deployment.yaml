apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app-v1
  template:
    metadata:
      labels:
        app: student-app-v1
    spec:
      containers:
      - name: student-app
        image: <dockerhub-username>/student-app:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: student-app-v1-svc
spec:
  type: LoadBalancer
  selector:
    app: student-app-v1
  ports:
  - port: 8081
    targetPort: 5000